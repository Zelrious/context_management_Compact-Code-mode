[project]
name = "challenge-b-context-management"
version = "0.1.0"
description = "Challenge B agent with selective context compaction and restricted Code Mode"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3,<2",
    "langchain-openai>=1.6.7,<2",
    "python-dotenv>=1.2.4,<2",
    "pyyaml>=6.0.3,<7",
    "streamlit>=1.65.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
